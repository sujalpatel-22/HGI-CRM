name: Android build & test

on:
  push:
    branches: [main, "android-*"]
  pull_request:
  workflow_dispatch:

# contents: write only so the job can publish its logs + APK/AAB to the ci-output-* branches
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web + signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          mkdir -p logs
          npm install --no-audit --no-fund 2>&1 | tee logs/01-npm-install.log
          npm ls --depth=0 2>&1 | tee logs/01-npm-versions.log || true

      - name: Build web app (offline bundle)
        run: npm run build:web 2>&1 | tee logs/02-build-web.log

      - name: Web tests (Chromium — phone, tablet, desktop)
        run: |
          npx playwright install --with-deps chromium > logs/03-playwright-install.log 2>&1
          npm run test:web 2>&1 | tee logs/03-web-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Generate & patch Android project
        run: |
          npx cap add android 2>&1 | tee logs/04-cap-add.log
          node tools/patch-android.mjs 2>&1 | tee logs/04-patch.log
          npx cap sync android 2>&1 | tee logs/04-cap-sync.log
          cat android/variables.gradle > logs/04-variables.gradle.txt || true

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "HGI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HGI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "HGI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=release-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signing with a throw-away TEST key. Do NOT upload this build to Google Play."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias hgi-test -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=HGI Billing TEST, O=HARIGURU INDUSTRIES, C=IN" -noprompt
            echo "HGI_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "HGI_KEY_ALIAS=hgi-test" >> "$GITHUB_ENV"
            echo "HGI_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "mode=test-key" >> "$GITHUB_OUTPUT"
          fi
          echo "HGI_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "HGI_VERSION_CODE=$(( 100 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "HGI_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Gradle build (debug APK, release APK, release AAB)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease 2>&1 | tee ../logs/05-gradle.log

      - name: Verify signatures & package
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          {
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            jarsigner -verify -verbose:summary "$AAB" | tail -3
            "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label:|uses-permission"
          } 2>&1 | tee logs/06-verify.log
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'36'" || (echo "::error::targetSdk must be 36 for Google Play" && exit 1)

      - name: Collect artifacts
        run: |
          mkdir -p dist
          V="$HGI_VERSION_NAME-$HGI_VERSION_CODE"
          TAG=$([ "${{ steps.signing.outputs.mode }}" = "release-key" ] && echo "" || echo "-TESTKEY")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/HGI-Billing-$V$TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/HGI-Billing-$V$TAG.aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/HGI-Billing-$V-debug.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # full generated Android Studio project (without build outputs) for local builds
          tar --exclude='android/app/build' --exclude='android/build' --exclude='android/.gradle' --exclude='android/app/src/main/assets/public' \
            -czf "dist/HGI-Billing-$V-android-project.tgz" android

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hgi-billing-android
          path: dist/
          if-no-files-found: error

      - name: Publish logs & build files to branch ci-output-build
        if: always()
        run: |
          OUT=$RUNNER_TEMP/ci-out; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r logs "$OUT/" 2>/dev/null || true
          [ -d dist ] && cp -r dist "$OUT/" || true
          [ -d tests/out ] && mkdir -p "$OUT/web-screens" && cp tests/out/*.png "$OUT/web-screens/" 2>/dev/null || true
          echo "run=$GITHUB_RUN_ID number=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA ref=$GITHUB_REF status=${{ job.status }} signing=${{ steps.signing.outputs.mode }}" > "$OUT/STATUS.txt"
          cd "$OUT" && git init -q -b ci-output-build && git add -A
          git -c user.name="hgi-ci" -c user.email="hgi-ci@users.noreply.github.com" commit -qm "build output run $GITHUB_RUN_ID (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output-build

  emulator-test:
    name: Emulator API ${{ matrix.api }} (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, profile: pixel_2, target: google_apis }   # Android 11, 5" phone
          - { api: 33, profile: pixel_6, target: google_apis }   # Android 13, 6.4" phone
          - { api: 35, profile: pixel_c, target: google_apis }   # Android 15, 10" tablet
          - { api: 36, profile: pixel_7, target: google_apis }   # Android 16 (target SDK)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.0 && npx playwright install android
      - uses: actions/download-artifact@v4
        with:
          name: hgi-billing-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: |
            mkdir -p tests/out-android
            adb install -r dist/*-debug.apk 2>&1 | tee tests/out-android/install.log
            HGI_TEST_LABEL=api${{ matrix.api }}-${{ matrix.profile }} node tests/android-smoke.mjs > tests/out-android/smoke.log 2>&1; R=$?; cat tests/out-android/smoke.log; adb logcat -d > tests/out-android/logcat.txt 2>&1; exit $R
      - name: Publish results to branch ci-output-emu-api${{ matrix.api }}
        if: always()
        run: |
          OUT=$RUNNER_TEMP/ci-out; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r tests/out-android "$OUT/" 2>/dev/null || true
          echo "run=$GITHUB_RUN_ID api=${{ matrix.api }} profile=${{ matrix.profile }} status=${{ job.status }}" > "$OUT/STATUS.txt"
          B=ci-output-emu-api${{ matrix.api }}
          cd "$OUT" && git init -q -b "$B" && git add -A
          git -c user.name="hgi-ci" -c user.email="hgi-ci@users.noreply.github.com" commit -qm "emulator api${{ matrix.api }} run $GITHUB_RUN_ID (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
