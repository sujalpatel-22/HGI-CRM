name: Android build & test

on:
  push:
    branches: [main, "android-*"]
    tags: ["v*"]            # a version tag = production release build (owner key required)
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Production release build (fails unless the owner's release key secrets are set)"
        type: boolean
        default: false

# contents: write only so the job can publish its logs + APK/AAB to the ci-output-* branches
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web + signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          mkdir -p logs
          npm install --no-audit --no-fund 2>&1 | tee logs/01-npm-install.log
          npm ls --depth=0 2>&1 | tee logs/01-npm-versions.log || true

      - name: Build web app (offline bundle)
        run: npm run build:web 2>&1 | tee logs/02-build-web.log

      - name: Web tests (Chromium — phone, tablet, desktop)
        timeout-minutes: 25
        run: |
          # apt mirrors occasionally hang: bound the system-deps install, fall back to browser-only install (runner images ship the libs)
          timeout 420 npx playwright install --with-deps chromium > logs/03-playwright-install.log 2>&1 \
            || { echo "deps install timed out/failed — installing browser only" | tee -a logs/03-playwright-install.log; npx playwright install chromium >> logs/03-playwright-install.log 2>&1; }
          npm run test:web 2>&1 | tee logs/03-web-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 36 (runner's preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee logs/04-sdk.log
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM" | tee -a logs/04-sdk.log
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -5 | tee -a logs/04-sdk.log
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tee -a logs/04-sdk.log

      - name: Generate & patch Android project
        run: |
          npx cap add android 2>&1 | tee logs/04-cap-add.log
          node tools/patch-android.mjs 2>&1 | tee logs/04-patch.log
          npx cap sync android 2>&1 | tee logs/04-cap-sync.log
          cat android/variables.gradle > logs/04-variables.gradle.txt || true

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ "$RELEASE_REQUESTED" = "true" ] && { [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; }; then
            echo "::error::Production release requested but the owner's release key is not configured (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). A temporary test key is never used for a release."
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "HGI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HGI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "HGI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=release-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — INTERNAL TEST build signed with a throw-away key. Not for Google Play or customers."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias hgi-test -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=HGI Billing TEST, O=HARIGURU INDUSTRIES, C=IN" -noprompt
            echo "HGI_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "HGI_KEY_ALIAS=hgi-test" >> "$GITHUB_ENV"
            echo "HGI_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "mode=test-key" >> "$GITHUB_OUTPUT"
          fi
          echo "HGI_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "HGI_VERSION_CODE=$(( 100 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "HGI_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Gradle build (debug APK, release APK, release AAB)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease 2>&1 | tee ../logs/05-gradle.log

      - name: Verify signatures & package
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          {
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            jarsigner -verify -verbose:summary "$AAB" | tail -3
            "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label:|uses-permission"
          } 2>&1 | tee logs/06-verify.log
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'36'" || (echo "::error::targetSdk must be 36 for Google Play" && exit 1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "dataExtractionRules" || (echo "::error::backup rules missing from manifest" && exit 1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "allowBackup|dataExtractionRules|fullBackupContent|usesCleartextTraffic" | tee -a logs/06-verify.log
          # signing certificate fingerprint; for release builds it must match the owner's registered fingerprint (repo variable ANDROID_CERT_SHA256)
          FP=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F')
          DN=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate DN: //p' | head -1)
          echo "HGI_CERT_SHA256=$FP" >> "$GITHUB_ENV"
          echo "Signing certificate: $DN  SHA-256 $FP  (mode: ${{ steps.signing.outputs.mode }})" | tee -a logs/06-verify.log
          EXPECTED=$(echo "${{ vars.ANDROID_CERT_SHA256 }}" | tr -d ': ' | tr 'a-f' 'A-F')
          if [ "${{ steps.signing.outputs.mode }}" = "release-key" ] && [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$FP" ]; then
            echo "::error::Release key fingerprint $FP does not match the registered ANDROID_CERT_SHA256 $EXPECTED — wrong keystore in secrets"; exit 1
          fi
          if [ "${{ steps.signing.outputs.mode }}" = "release-key" ] && echo "$DN" | grep -q "HGI Billing TEST"; then echo "::error::release-key mode but the certificate is the test key"; exit 1; fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          V="$HGI_VERSION_NAME-$HGI_VERSION_CODE"
          TAG=$([ "${{ steps.signing.outputs.mode }}" = "release-key" ] && echo "" || echo "-INTERNAL-TESTKEY")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/HGI-Billing-$V$TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/HGI-Billing-$V$TAG.aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/HGI-Billing-$V-debug.apk"
          {
            echo "HGI Billing $HGI_VERSION_NAME (versionCode $HGI_VERSION_CODE) — commit $GITHUB_SHA"
            echo "Signing mode: ${{ steps.signing.outputs.mode }}"
            echo "Certificate SHA-256: $HGI_CERT_SHA256"
            [ "${{ steps.signing.outputs.mode }}" = "release-key" ] && echo "Signed with the owner's release key." || echo "INTERNAL TEST BUILD — throw-away key. NOT for Google Play, NOT for customers. Updates from this build cannot be installed over a Play/release install."
          } > dist/SIGNING.txt
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # full generated Android Studio project (without build outputs) for local builds
          tar --exclude='build' --exclude='.gradle' --exclude='.idea' --exclude='android/app/src/main/assets/public' \
            -czf "dist/HGI-Billing-$V-android-project.tgz" android

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hgi-billing-android
          path: dist/
          if-no-files-found: error

      - name: Publish logs & build files to branch ci-output-build
        if: always()
        run: |
          OUT=$RUNNER_TEMP/ci-out; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r logs "$OUT/" 2>/dev/null || true
          [ -d dist ] && cp -r dist "$OUT/" || true
          [ -d tests/out ] && mkdir -p "$OUT/web-screens" && cp tests/out/*.png "$OUT/web-screens/" 2>/dev/null || true
          echo "run=$GITHUB_RUN_ID number=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA ref=$GITHUB_REF status=${{ job.status }} signing=${{ steps.signing.outputs.mode }}" > "$OUT/STATUS.txt"
          cd "$OUT" && git init -q -b ci-output-build && git add -A
          git -c user.name="hgi-ci" -c user.email="hgi-ci@users.noreply.github.com" commit -qm "build output run $GITHUB_RUN_ID (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output-build

  emulator-test:
    name: Emulator API ${{ matrix.api }} (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, profile: pixel_2, target: google_apis }   # Android 11, 5" phone
          - { api: 33, profile: pixel_6, target: google_apis }   # Android 13, 6.4" phone
          - { api: 35, profile: pixel_c, target: google_apis }   # Android 15, 10" tablet
          - { api: 36, profile: pixel_7, target: google_apis }   # Android 16 (target SDK)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.0 && npx playwright install android
      - uses: actions/download-artifact@v4
        with:
          name: hgi-billing-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test on emulator (attempt 1)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: |
            mkdir -p tests/out-android
            adb uninstall in.hariguru.billing > /dev/null 2>&1 || true
            adb install -r dist/*-debug.apk 2>&1 | tee tests/out-android/install.log
            HGI_TEST_LABEL=api${{ matrix.api }}-${{ matrix.profile }} node tests/android-smoke.mjs > tests/out-android/smoke.log 2>&1; R=$?; cat tests/out-android/smoke.log; adb logcat -d > tests/out-android/logcat.txt 2>&1; exit $R
      - name: Run smoke test on emulator (attempt 2 — emulator boot on hosted runners is sometimes flaky)
        id: emu2
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: |
            [ -d tests/out-android ] && mv tests/out-android tests/out-android/../out-android-attempt1 || true
            mkdir -p tests/out-android
            adb uninstall in.hariguru.billing > /dev/null 2>&1 || true
            adb install -r dist/*-debug.apk 2>&1 | tee tests/out-android/install.log
            HGI_TEST_LABEL=api${{ matrix.api }}-${{ matrix.profile }} node tests/android-smoke.mjs > tests/out-android/smoke.log 2>&1; R=$?; cat tests/out-android/smoke.log; adb logcat -d > tests/out-android/logcat.txt 2>&1; exit $R
      - name: Emulator result
        if: always()
        run: |
          echo "attempt1=${{ steps.emu1.outcome }} attempt2=${{ steps.emu2.outcome }}"
          [ "${{ steps.emu1.outcome }}" = "success" ] || [ "${{ steps.emu2.outcome }}" = "success" ]
      - name: Publish results to branch ci-output-emu-api${{ matrix.api }}
        if: always()
        run: |
          OUT=$RUNNER_TEMP/ci-out; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r tests/out-android "$OUT/" 2>/dev/null || true
          cp -r tests/out-android-attempt1 "$OUT/" 2>/dev/null || true
          echo "run=$GITHUB_RUN_ID api=${{ matrix.api }} profile=${{ matrix.profile }} status=${{ job.status }} attempt1=${{ steps.emu1.outcome }} attempt2=${{ steps.emu2.outcome }}" > "$OUT/STATUS.txt"
          B=ci-output-emu-api${{ matrix.api }}
          cd "$OUT" && git init -q -b "$B" && git add -A
          git -c user.name="hgi-ci" -c user.email="hgi-ci@users.noreply.github.com" commit -qm "emulator api${{ matrix.api }} run $GITHUB_RUN_ID (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
